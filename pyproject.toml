[project]
name = "vice-clipper"
version = "0.1.0"
description = "Local pipeline that turns GTA 6 streams and videos into 9:16 clips"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "ruamel.yaml>=0.18",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "websockets>=13",
    "google-genai>=1.0",
    "faster-whisper>=1.1",
    "nvidia-cublas-cu12>=12.4,<12.9; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'",
    "aiogram>=3.10",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "numpy>=1.26",
    "opencv-python-headless>=4.10,<5",
    "curl-cffi>=0.7",
    "streamlink>=7",
    "yt-dlp>=2025.1.1",
    "chat-downloader>=0.2.8",
    "python-multipart>=0.0.34",
    "truststore>=0.10.5",
]

[project.scripts]
vc = "vc.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
